name: Build et push Docker

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Connexion a Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.patrice1607 }}
          password: ${{ secrets.notepad .github\workflows\docker.yml }}

      - name: Construire l image
        run: docker build -t ${{ secrets.patrice1607 }}/go-api-rattrapage:latest .

      - name: Envoyer l image
        run: docker push ${{ secrets.patrice1607 }}/go-api-rattrapage:latest